services:
  backend:
    build: ./metro_map_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./metro_map_backend:/app
    # env_file:
    #   - ./metro_map_backend/.env   # uncomment if the backend reads secrets/API keys from .env
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./metro_map_frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./metro_map_frontend:/app
      - /app/node_modules   # anonymous volume so the host mount doesn't hide the image's node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true   # only needed if HMR doesn't pick up changes (macOS/Windows)
    depends_on:
      backend:
        condition: service_healthy # Waits until backend healthcheck passes
    restart: unless-stopped